name: Release sanity check

# Runs on a release tag push, from the tagged commit.  See
# ci/check_release.py and doc/contributing/backpatching.mdx.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check release
        run: python3 ci/check_release.py "$GITHUB_REF_NAME"
