name: check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Parallel copies of every matrix cell (flake hunting)'
        required: false
        default: '1'
      repeats:
        description: 'Times to run the check inside one job'
        required: false
        default: '1'
      cpu:
        description: 'Narrow to one CPU (all = the usual dispatch set)'
        type: choice
        options: [all, amd64, arm64]
        default: all
      pg_version:
        description: 'Narrow to one PostgreSQL major'
        type: choice
        options: [all, '16', '17', '18']
        default: all
      compiler:
        description: 'Narrow to one compiler'
        type: choice
        options: [all, clang, gcc]
        default: all
      check_type:
        description: 'Narrow to one check type'
        type: choice
        options: [all, normal, debug, sanitize, check_page, valgrind_1, valgrind_2, pg_tests, dm_log_writes]
        default: all

jobs:
  matrix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: python
        env:
          FANOUT: ${{ github.event.inputs.jobs || '1' }}
          SEL_CPU: ${{ github.event.inputs.cpu || 'all' }}
          SEL_PG: ${{ github.event.inputs.pg_version || 'all' }}
          SEL_COMP: ${{ github.event.inputs.compiler || 'all' }}
          SEL_CT: ${{ github.event.inputs.check_type || 'all' }}
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        run: |
          import os, json, itertools

          event_name = os.environ["GITHUB_EVENT_NAME"]
          ref        = os.environ.get("GITHUB_REF_NAME", "")

          check_types = [
              "normal", "debug", "sanitize", "check_page",
              "valgrind_1", "valgrind_2", "pg_tests", "dm_log_writes",
          ]

          # workflow_dispatch can ask for several copies of every cell, so a
          # flaky test gets many independent shots at failing.  GitHub refuses
          # a matrix above 256 jobs outright, so clamp rather than let the run
          # die on a number that looked reasonable.
          try:
              fanout = int(os.environ.get("FANOUT") or 1)
          except ValueError:
              fanout = 1
          fanout = max(1, fanout)

          try:
              repeats = int(os.environ.get("REPEATS") or 1)
          except ValueError:
              repeats = 1
          repeats = max(1, repeats)

          # A dispatch may narrow the matrix to the cell being chased.  Any
          # narrowing selects out of the *full* matrix, since the point is to
          # reach a cell the abbreviated sets skip; with everything left at
          # "all" the dispatch keeps the set it has today.
          sel = {
              "cpu": os.environ.get("SEL_CPU") or "all",
              "pg_version": os.environ.get("SEL_PG") or "all",
              "compiler": os.environ.get("SEL_COMP") or "all",
              "check_type": os.environ.get("SEL_CT") or "all",
          }
          narrowed = any(v != "all" for v in sel.values())

          def keep(cell):
              return all(v == "all" or str(cell[k]) == v for k, v in sel.items())

          # dm-log-writes needs a kernel module unavailable on arm64 runners
          def make_matrix(combos):
              global fanout

              cells = [
                  cell
                  for (cpu, pg, comp), ct in itertools.product(combos, check_types)
                  if not (cpu == "arm64" and ct == "dm_log_writes")
                  for cell in [{"cpu": cpu, "pg_version": pg,
                                "compiler": comp, "check_type": ct}]
                  if keep(cell)
              ]
              if not cells:
                  raise SystemExit(f"::error::no matrix cell matches {sel}")

              # The check step's budget scales with the repeat count.  It is
              # computed here because GitHub expressions have no arithmetic:
              # multiplying in the workflow makes the file fail to parse.
              for cell in cells:
                  ct = cell["check_type"]
                  base = (150 if ct.startswith("valgrind_")
                          else 60 if ct == "dm_log_writes"
                          else 40 if ct == "sanitize"
                          else 30)
                  budget = base * repeats
                  if budget > 350:
                      print(f"::warning::{ct} needs {budget} min for "
                            f"{repeats} repeats, over the 6h job limit; "
                            f"capping at 350")
                      budget = 350
                  cell["timeout"] = budget
              limit = max(1, 256 // len(cells))
              if fanout > limit:
                  print(f"::warning::jobs={fanout} would need {fanout * len(cells)} "
                        f"matrix jobs, over GitHub's limit of 256; using {limit}")
                  fanout = limit
              return {
                  "include": [
                      dict(cell, run=r)
                      for r, cell in itertools.product(range(1, fanout + 1), cells)
                  ]
              }

          full_combos = list(itertools.product(
              ["amd64", "arm64"], [16, 17, 18], ["clang", "gcc"]
          ))

          # Push to non-main branches: limited set to save CI time.
          # PG18 is the current development target, so it keeps both
          # cpu/compiler combos; PG16 and PG17 each get one combo as a
          # smoke check.  We rotate which cpu+compiler each older major
          # lands on between (amd64,gcc) and (arm64,clang) using the
          # commit SHA, so a feature branch series exercises both
          # architectures for both older majors over time.  Each push
          # still has all four cpu/compiler cells covered (across the
          # three majors), and the total job count is unchanged.
          # Main pushes and fork PRs continue to exercise the full
          # matrix unconditionally.
          sha_hex = os.environ.get("GITHUB_SHA", "0") or "0"
          flip = int(sha_hex[:8], 16) % 2
          older_a = ("amd64", "gcc") if flip == 0 else ("arm64", "clang")
          older_b = ("arm64", "clang") if flip == 0 else ("amd64", "gcc")
          branch_combos = [
              (older_a[0], 16, older_a[1]),
              (older_b[0], 17, older_b[1]),
              ("amd64", 18, "gcc"),
              ("arm64", 18, "clang"),
          ]

          # Same-repo PRs: complementary set covering what branch_combos skips
          pr_combos = [
              ("arm64", 16, "gcc"),
              ("amd64", 16, "clang"),
              ("arm64", 17, "gcc"),
              ("amd64", 17, "clang"),
              ("arm64", 18, "gcc"),
              ("amd64", 18, "clang"),
          ]

          if event_name == "workflow_dispatch" and narrowed:
              combos = full_combos
          elif event_name == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as f:
                  pr_event = json.load(f)
              head_repo = pr_event["pull_request"]["head"]["repo"]["full_name"]
              base_repo = pr_event["pull_request"]["base"]["repo"]["full_name"]
              # Fork PRs get the full matrix; same-repo PRs get the complementary set
              combos = full_combos if head_repo != base_repo else pr_combos
          elif ref == "main":
              combos = full_combos
          else:
              combos = branch_combos

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(make_matrix(combos))}\n")

  check:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    # Select runner based on CPU architecture
    runs-on: ${{ matrix.cpu == 'arm64' && 'blacksmith-8vcpu-ubuntu-2404-arm' || 'blacksmith-8vcpu-ubuntu-2404' }}
    env:
      LLVM_VER: 18
      CPU: ${{ matrix.cpu }}
      CHECK_TYPE: ${{ matrix.check_type }}
      PG_VERSION: ${{ matrix.pg_version }}
      COMPILER: ${{ matrix.compiler }}
    steps:
      - name: Checkout extension code into workspace directory
        uses: actions/checkout@v6
        with:
          path: orioledb

      - name: Get the required tag name
        shell: bash
        run: |
          echo "PGTAG=$(grep '^${{ matrix.pg_version }}: ' orioledb/.pgtags | cut -d' ' -f2-)" >> $GITHUB_ENV

      - name: Checkout PostgreSQL code into workspace directory
        uses: actions/checkout@v6
        with:
          repository: orioledb/postgres
          ref: ${{ env.PGTAG }}
          path: postgresql

      - name: Setup prerequisites
        run: bash ./orioledb/ci/prerequisites.sh

      - name: Build
        run: bash ./orioledb/ci/build.sh

      - name: Install post build prerequisites
        run: bash ./orioledb/ci/post_build_prerequisites.sh

      - name: Check
        timeout-minutes: ${{ matrix.timeout }}
        env:
          REPEATS: ${{ github.event.inputs.repeats || '1' }}
        # check.sh does the repeating: only it knows which part of a check
        # type is the test and which is scaffolding.  Re-running it whole
        # would re-initdb pg_tests' cluster on top of itself.
        run: bash ./orioledb/ci/check.sh

      - name: Check output
        run: bash ./orioledb/ci/check_output.sh
        if: ${{ success() || failure() }}

      - name: Upload tests diffs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_test.diffs
          path: |
            ./orioledb/test/**/regression.diffs
            ./orioledb/test/**/isolation_filtered.diffs
            ./postgresql/src/test/**/regression.diffs
            ./postgresql/src/test/**/isolation_filtered.diffs
            ./postgresql/dump_diff_*.txt
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload tests logs
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_test.logs
          path: |
            ./orioledb/test/tmp_check_t/*/logs/*log
            ./orioledb/test/tmp_check/log/*log
            ./orioledb/test/tmp_check_iso/log/*log
            ./orioledb/test/log/*.log
            ./postgresql/pg.log
            ./postgresql/rep_pg.log
            ./postgresql/src/test/**/tmp_check/*.dump
            ./postgresql/src/test/**/tmp_check/log/*
          retention-days: 2
          if-no-files-found: ignore

      - name: Show stuck processes
        run: bash ./orioledb/ci/list_stuck.sh
        if: ${{ always() }}

      - name: Run lcov
        if: ${{ matrix.check_type != 'sanitize' && matrix.check_type != 'check_page' }}
        run: bash ./orioledb/ci/lcov.sh

      - name: Create artifact for coverage.info
        if: ${{ matrix.check_type != 'sanitize' && matrix.check_type != 'check_page' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pg_version }}_${{ matrix.cpu }}_${{ matrix.compiler }}_${{ matrix.check_type }}_r${{ matrix.run }}_coverage.info
          path: ./orioledb/coverage.info
          retention-days: 1
          overwrite: true

  finish:
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout extension code into workspace directory
        uses: actions/checkout@v6
        with:
          path: orioledb

      - name: Retrieve saved coverage.infos
        uses: actions/download-artifact@v8

      - name: Merge coverage files
        run: bash ./orioledb/ci/lcov_merge.sh

      - name: coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ./orioledb/coverage.info
          # The action downloads its own binary at run time; when that
          # download or its checksum fetch fails ("Failed to download
          # coveralls binary or checksum") the whole run goes red over a
          # coverage upload that changes nothing about the tests.
          fail-on-error: false

  cleanup:
    needs: finish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: remove artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "*coverage.info*"
          failOnError: false
