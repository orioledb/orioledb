shared_preload_libraries = 'orioledb'
log_error_verbosity = verbose
orioledb.undo_buffers = 8MB
orioledb.debug_disable_bgwriter = true
orioledb.use_sparse_files = true
# Rewind is disabled for the shared regression instance: with rewind on, a
# dropped tree's in-memory pages are pinned for the whole retention window and
# cannot be evicted, exhausting main_buffers under drop-heavy tests.  Rewind is
# covered separately by the isolated testgres tests (rewind_*_test.py).  See
# orioledb/orioledb#1009.
orioledb.enable_rewind = false
checkpoint_timeout = 9000
max_wal_size = 5GB
wal_level = logical
orioledb.main_buffers = 128MB
